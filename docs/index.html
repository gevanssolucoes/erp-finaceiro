  if(F.cc.size&&!F.cc.has(nomeCentro(l.centro_custo_id)||'—'))return false;
  if(F.pf.size&&!F.pf.has(nomeParc(l.parceiro_id)||'—'))return false;
  if(F.ct.size){const c=conta(l.conta_id);if(!c||!cadeiaConta(c.id).concat(c).some(x=>F.ct.has(x.codigo+' '+x.nome)))return false}
  return true}

async function indicadoresBCB(){const u=(s,n)=>fetch(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${s}/dados/ultimos/${n}?formato=json`).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
  const [s,i,d]=await Promise.all([u(432,1),u(189,12),u(1,2)]);
  const ac=(i.reduce((a,x)=>a*(1+ +x.valor/100),1)-1)*100;
  return {selic:{valor:+s[0].valor,data:s[0].data},igpm:{mes:+i.at(-1).valor,acum12:ac,data:i.at(-1).data},dolar:{valor:+d.at(-1).valor,var:d.length>1?(d.at(-1).valor/d[0].valor-1)*100:0,data:d.at(-1).data}}}
const fmtPct=(x,dg=2)=>(x>0?'+':'')+x.toLocaleString('pt-BR',{minimumFractionDigits:dg,maximumFractionDigits:dg})+'%';
async function faixaIndicadores(){
  const d=await indicadores().catch(()=>null);
  if(!d)return `<section class="ind-bar"><div class="ind muted">Indicadores do Banco Central indisponíveis agora.</div></section>`;
  const it=(ic,nome,val,sub)=>`<div class="ind"><span class="tic tic-accent">${icone(ic,15)}</span><div><div class="ind-n">${nome}</div><div class="ind-v">${val}</div><div class="ind-s">${sub}</div></div></div>`;
  return `<section class="ind-bar">${it('selic','Selic (meta)',d.selic.valor.toLocaleString('pt-BR',{minimumFractionDigits:2})+'% a.a.','desde '+d.selic.data)}${it('igpm','IGP-M',fmtPct(d.igpm.acum12)+' em 12 meses',`último mês ${fmtPct(d.igpm.mes)} · ${d.igpm.data.slice(3)}`)}${it('dolar','Dólar PTAX','R$ '+d.dolar.valor.toLocaleString('pt-BR',{minimumFractionDigits:4,maximumFractionDigits:4}),`${fmtPct(d.dolar.var)} no dia · ${d.dolar.data}`)}<div class="ind-src">Fonte: Banco Central (SGS)${d.demo?' · valores de exemplo na demonstração':''}</div></section>`;
}

<script>
// ===================== Identidade por empresa, tela de entrada e registro de acessos
const CORES_EMP=['#0d5f73','#1f6f43','#2f4b8f','#7a3e9d','#9b2c48','#b4532a','#8a6d1d','#334155'];
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const iniciais=t=>String(t||'?').replace(/[^\p{L}\p{N} ]/gu,'').split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase()||'?';
const corValida=c=>/^#[0-9a-f]{6}$/i.test(c||'');
function corEmp(e){if(corValida(e?.cor))return e.cor;const i=e?.id?(S.empresas||[]).findIndex(x=>x.id===e.id):-1;if(i>=0)return CORES_EMP[i%CORES_EMP.length];const s=String(e?.cnpj||e?.id||e?.nome||'');let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return CORES_EMP[h%CORES_EMP.length]}
function seloEmp(e,tam=30){
  if(e?.logo)return `<img class="selo" src="${esc(e.logo)}" alt="" style="width:${tam}px;height:${tam}px">`;
  return `<span class="selo" style="width:${tam}px;height:${tam}px;background:${corEmp(e)};font-size:${Math.round(tam*.38)}px">${esc(iniciais(e?.nome||nomeEmp(e)))}</span>`;
}
const papelTxt=id=>S.master?'master':({admin:'Administrador',financeiro:'Financeiro',rh:'RH',leitura:'Leitura'}[S.papeis[id]]||'');
const primeiroNome=()=>String(S.perfil?.nome||S.user?.email||'').split(/[\s@]/)[0];
function dispositivo(){const u=navigator.userAgent;const t=/iPad|Tablet/i.test(u)?'Tablet':/Mobi|Android|iPhone/i.test(u)?'Celular':'Computador';
  const n=/Edg\//.test(u)?'Edge':/OPR\//.test(u)?'Opera':/Chrome\//.test(u)?'Chrome':/Firefox\//.test(u)?'Firefox':/Safari\//.test(u)?'Safari':'navegador';
  const so=/Windows/.test(u)?'Windows':/iPhone|iPad|Mac OS X/.test(u)?(/iPhone|iPad/.test(u)?'iOS':'Mac'):/Android/.test(u)?'Android':/Linux/.test(u)?'Linux':'';return `${t} · ${n}${so?' · '+so:''}`}

// cor e nome da empresa no menu, nos botões e na aba do navegador
function aplicarMarca(e){
  const r=document.documentElement;
  if(e){r.style.setProperty('--emp',corEmp(e));r.classList.add('emp')}else{r.style.removeProperty('--emp');r.classList.remove('emp')}
  document.getElementById('brandLogo').innerHTML=e?seloEmp(e):LOGO;
  document.getElementById('brandNome').textContent=e?nomeEmp(e):APP_NOME;
  document.getElementById('brandSub').textContent=e?`${APP_NOME} · ${papelTxt(e.id)}`:(S.master?APP_SUB+' · master':APP_SUB);
  document.title=e?nomeEmp(e)+' · '+APP_NOME:APP_NOME;
}
// a marca segue o que está sendo visto: uma empresa só = marca dela; várias = Gevans Gestor
function marcaPelaSelecao(){const es=S.empresas.length?selEmp():[];const e=es.length===1?es[0]:null;const k=e?e.id+'|'+(e.cor||'')+'|'+(e.logo||'').length+'|'+nomeEmp(e):'*';if(k!==S._marca){S._marca=k;aplicarMarca(e)}}

function registrarAcesso(empId){sb.from('acessos').insert({empresa_id:empId||null,dispositivo:dispositivo()}).then(({error})=>{if(error)console.warn('acesso não registrado',error.message)})}

function ativarEmpresa(id){
  const e=id&&id!=='*'?empresa(id):null;
  S.empAtiva=e?e.id:null;
  S.sel=new Set(unidades().filter(u=>!e||u.emp.id===e.id).map(u=>u.key));
  lsSet('gg_emp',e?e.id:'*');
  lsSet('gg_marca',e?{nome:nomeEmp(e),cor:corEmp(e),logo:e.logo&&e.logo.length<60000?e.logo:null}:null);
  S._marca=null;marcaPelaSelecao();registrarAcesso(S.empAtiva);
}

// tela de entrada: "Olá, Maya" + a empresa que ela está acessando
function escolherEmpresa(trocando){
  const es=S.empresas;if(!es.length)return Promise.resolve();
  const app=document.getElementById('app'),a=document.getElementById('auth');
  const ult=lsGet('gg_emp');
  const topo=`<div class="brand" style="padding:0">${LOGO}<div><b style="color:var(--ink)">${APP_NOME}</b><small style="color:var(--ink-2)">${APP_SUB}</small></div></div>`;
  if(es.length===1&&!trocando){
    const e=es[0];a.innerHTML=`<div class="auth-card entrada">${topo}<div class="boas"><span class="selo-g">${seloEmp(e,64)}</span><div><p class="ola">Olá, ${esc(primeiroNome())}</p><h1>${esc(nomeEmp(e))}</h1><p>${esc(e.razao_social&&e.razao_social!==nomeEmp(e)?e.razao_social+' · ':'')}CNPJ <span class="mono">${esc(fmtCnpj(e.cnpj))}</span></p><p>Seu acesso: <b>${esc(papelTxt(e.id))}</b></p></div></div><div class="carregando"><span></span></div></div>`;
    a.style.setProperty('--emp',corEmp(e));app.hidden=true;a.hidden=false;
    return new Promise(res=>setTimeout(()=>{ativarEmpresa(e.id);a.hidden=true;app.hidden=false;res()},1100));
  }
  const op=(id,selo,nome,info,marca)=>`<button class="emp-op" data-entra="${id}" style="--c:${marca}">${selo}<span class="emp-tx"><b>${esc(nome)}</b><small>${info}</small></span>${ult===id?'<span class="chip info">último acesso</span>':''}<span class="emp-seta" aria-hidden="true">›</span></button>`;
  a.innerHTML=`<div class="auth-card entrada largo">${topo}<div><p class="ola">Olá, ${esc(primeiroNome())}</p><h1>${trocando?'Trocar de empresa':'Em qual empresa você vai trabalhar?'}</h1></div>
    <div class="emp-lista">${es.map(e=>op(e.id,seloEmp(e,40),nomeEmp(e),`${docTipo(e)} <span class="mono">${esc(fmtCnpj(e.cnpj))}</span> · ${esc(papelTxt(e.id))}`,corEmp(e))).join('')}
    ${es.length>1?op('*',`<span class="selo" style="width:40px;height:40px;background:var(--side);font-size:15px">${es.length}</span>`,'Todas as empresas','Visão consolidada · '+S.predios.length+' unidades','var(--side)'):''}</div>
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">${trocando?'<button class="linkbtn small" data-volta="1">Voltar sem trocar</button>':'<span></span>'}<button class="linkbtn small" data-acao="sair">Sair</button></div></div>`;
  app.hidden=true;a.hidden=false;a.style.removeProperty('--emp');
  a.querySelector(`[data-entra="${ult}"]`)?.focus();
  return new Promise(res=>{a.onclick=ev=>{const b=ev.target.closest('[data-entra],[data-volta]');if(!b)return;a.onclick=null;if(b.dataset.entra)ativarEmpresa(b.dataset.entra);a.hidden=true;app.hidden=false;res()}});
}

// login: lembra a última empresa acessada neste aparelho
function ultimaMarca(){const m=lsGet('gg_marca');if(!m?.nome)return '';const e={nome:m.nome,cor:m.cor,logo:m.logo};return `<div class="ultima" style="--emp:${corEmp(e)}">${seloEmp(e,34)}<span>Último acesso neste aparelho<b>${esc(m.nome)}</b></span></div>`}

// ---------- identidade visual da empresa (cadastro)
function prevMarca(f){const e={nome:f.fantasia.value.trim()||'Empresa',cor:f.cor.value,logo:f.logo.value||null};
  document.getElementById('prevMarca').innerHTML=`<div class="mini-side" style="--emp:${e.cor}"><div class="brand" style="padding:0">${seloEmp(e,30)}<div><b>${esc(e.nome)}</b><small>${APP_NOME} · Financeiro</small></div></div><span class="mini-nav">Painel</span></div><button type="button" class="btn" style="background:${e.cor};pointer-events:none">Botão da empresa</button>`}
function formMarca(empId){const e=empresa(empId);
  drawer(`<h3>Identidade visual · ${esc(nomeEmp(e))}</h3><p class="muted" style="margin:0">Aparece na tela de entrada, no menu, nos botões e na aba do navegador quando alguém entra nesta empresa.</p>
  <form data-form="marca" data-emp="${e.id}" class="form-grid">
    <div class="field wide"><label for="mFant">Nome fantasia (é o nome que aparece no app)</label><input id="mFant" name="fantasia" value="${esc(e.nome_fantasia||'')}" placeholder="${esc(e.razao_social)}"></div>
    <div class="field wide"><label for="mCor">Cor da empresa</label><div class="cores">${CORES_EMP.map(c=>`<button type="button" class="cor" data-cor="${c}" style="background:${c}" aria-label="Cor ${c}"></button>`).join('')}<input id="mCor" type="color" name="cor" value="${corEmp(e)}" aria-label="Outra cor"></div></div>
    <div class="field wide"><label for="mLogo">Logo (PNG, JPG ou SVG; quadrado fica melhor)</label><input id="mLogo" type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp"><input type="hidden" name="logo" value="${esc(e.logo||'')}"></div>
    <div class="wide prev-marca" id="prevMarca"></div>
    <div class="wide" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn">Salvar</button><button type="button" class="btn ghost" data-tira-logo="1">Tirar logo</button><button type="button" class="btn ghost" data-acao="fechar">Cancelar</button></div></form>`);
  prevMarca(document.querySelector('form[data-form=marca]'));
}
function lerLogo(file,f){
  if(file.size>3e6)return toast('Imagem muito grande. Use uma de até 3 MB.');
  const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
    const L=160,k=Math.min(1,L/Math.max(img.width||L,img.height||L)),w=Math.max(1,Math.round((img.width||L)*k)),h=Math.max(1,Math.round((img.height||L)*k));
    const c=document.createElement('canvas');c.width=c.height=Math.max(w,h);const x=c.getContext('2d');x.drawImage(img,(c.width-w)/2,(c.height-h)/2,w,h);
    let d=c.toDataURL('image/png');if(d.length>150000)d=c.toDataURL('image/webp',.85);if(d.length>150000)d=c.toDataURL('image/jpeg',.85);
    f.logo.value=d;prevMarca(f)};img.onerror=()=>toast('Não consegui ler esta imagem.');img.src=fr.result};fr.readAsDataURL(file);
}
const FORMS_MARCA={
  async marca(f){const id=f.dataset.emp;if(!corValida(f.cor.value))return toast('Escolha uma cor válida.');
    const {error}=await sb.from('empresas').update({nome_fantasia:f.fantasia.value.trim()||null,cor:f.cor.value,logo:f.logo.value||null}).eq('id',id);
    if(error){if(!/column|cor|logo/i.test(error.message))throw error;
      const {error:e2}=await sb.from('empresas').update({nome_fantasia:f.fantasia.value.trim()||null}).eq('id',id);if(e2)throw e2;
      fecharDrawer();toast('Nome fantasia salvo. Cor e logo ficam para depois da atualização do banco.');await recarregarCad();S._marca=null;marcaPelaSelecao();return}
    fecharDrawer();toast('Identidade visual salva.');await recarregarCad();
    if(lsGet('gg_emp')===id){const e=empresa(id);lsSet('gg_marca',{nome:nomeEmp(e),cor:corEmp(e),logo:e.logo&&e.logo.length<60000?e.logo:null})}
    S._marca=null;marcaPelaSelecao()},
};
document.addEventListener('click',ev=>{
  const c=ev.target.closest('[data-cor]');if(c){const f=c.closest('form');f.cor.value=c.dataset.cor;prevMarca(f);return}
  if(ev.target.closest('[data-tira-logo]')){const f=ev.target.closest('form');f.logo.value='';f.querySelector('#mLogo').value='';prevMarca(f)}
});
document.addEventListener('input',ev=>{const f=ev.target.form;if(f?.dataset.form==='marca'&&(ev.target.name==='cor'||ev.target.name==='fantasia'))prevMarca(f)});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='mLogo'&&t.files[0])lerLogo(t.files[0],t.form);else if(t.id==='acUser'){S.acUser=t.value;render(true)}});

// ---------- registro de acessos (só master)
async function painelAcessos(){
  let q=sb.from('acessos').select('*').order('entrou_em',{ascending:false}).limit(300);
  if(S.acUser)q=q.eq('usuario_id',S.acUser);
  const {data,error}=await q;
  if(error)return `<div class="panel"><h2>${icone('usuarios',16)} Registro de acessos</h2><p class="hint" style="margin:0">O registro começa a funcionar depois da atualização do banco.</p></div>`;
  data.forEach(a=>a.entrou_em=a.entrou_em||a.criado_em||new Date().toISOString());
  const nome=id=>{const u=(S.usuarios||[]).find(x=>x.usuario_id===id);return u?(u.nome||u.email):'usuário removido'};
  const hoje=HOJE,d7=new Date(Date.now()-7*864e5).toISOString();
  const nHoje=data.filter(a=>a.entrou_em.slice(0,10)===hoje).length,p7=new Set(data.filter(a=>a.entrou_em>=d7).map(a=>a.usuario_id)).size;
  const quando=t=>{const d=new Date(t);return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
  return `<div class="panel"><div class="ph"><div><h2>Registro de acessos</h2><p class="hint">Cada entrada no app e cada troca de empresa ficam registradas aqui. Só a conta master vê.</p></div>
    <div class="ctrls"><select id="acUser" aria-label="Pessoa"><option value="">Todas as pessoas</option>${(S.usuarios||[]).map(u=>`<option value="${u.usuario_id}" ${S.acUser===u.usuario_id?'selected':''}>${esc(u.nome||u.email)}</option>`).join('')}</select></div></div>
    <div class="ac-resumo"><div class="tile"><div class="lbl">Acessos hoje</div><div class="val">${nHoje}</div></div><div class="tile"><div class="lbl">Pessoas nos últimos 7 dias</div><div class="val">${p7}</div></div><div class="tile"><div class="lbl">Último acesso</div><div class="val" style="font-size:15px">${data[0]?esc(nome(data[0].usuario_id))+'<span class="unit">'+quando(data[0].entrou_em)+'</span>':'–'}</div></div></div>
    ${data.length?`<div class="tbl-wrap"><table><thead><tr><th>Data e hora</th><th>Pessoa</th><th>Empresa</th><th>Dispositivo</th></tr></thead><tbody>
    ${data.map(a=>{const e=a.empresa_id?empresa(a.empresa_id):null;return `<tr><td class="mono">${quando(a.entrou_em)}</td><td>${esc(nome(a.usuario_id))}</td><td><span class="emp-cel">${e?seloEmp(e,20)+esc(nomeEmp(e)):'<span class="muted">Todas as empresas</span>'}</span></td><td class="muted">${esc(a.dispositivo||'')}</td></tr>`}).join('')}
    </tbody></table></div>`:'<p class="muted" style="margin:0">Nenhum acesso registrado ainda.</p>'}</div>`;
}
</script>
<script>
// ===================== Contas bancárias, salário líquido (PF) e replicar lançamentos
const BANCOS_BR=[['Nubank','260'],['Caixa Econômica Federal','104'],['Banco do Brasil','001'],['Itaú','341'],['Bradesco','237'],['Santander','033'],['Inter','077'],['C6 Bank','336'],['PicPay','380'],['Mercado Pago','323'],['Sicoob','756'],['Sicredi','748'],['BTG Pactual','208'],['Banrisul','041'],['Safra','422']];
const addMes=(iso,n)=>{const [y,m,d]=iso.split('-').map(Number);const t=new Date(Date.UTC(y,m-1+n,1));const ult=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();return t.toISOString().slice(0,8)+String(Math.min(d,ult)).padStart(2,'0')};
const mesAno=iso=>MESES[+iso.slice(5,7)-1]+'/'+iso.slice(2,4);

// ---------- Contas bancárias
async function movBancos(){const ps=await todos(()=>sb.from('parcelas').select('conta_bancaria_id,valor,valor_pago,data_pagamento').eq('status','paga'));return ps.filter(p=>p.conta_bancaria_id)}
async function vBancos(){
  if(!S.empresas.length)return semEmpresa();
  const emps=S.bancoEmp&&S.bancoEmp!=='*'?S.empresas.filter(e=>e.id===S.bancoEmp):S.empresas;
  const ps=await movBancos();const mes=HOJE.slice(0,7);
  const calc=b=>{const m=ps.filter(p=>p.conta_bancaria_id===b.id&&(!b.data_saldo_inicial||p.data_pagamento>=b.data_saldo_inicial)).map(p=>({v:+(p.valor_pago??p.valor),d:p.data_pagamento||''}));
    const ent=sum(m.filter(x=>x.v>0).map(x=>x.v)),sai=sum(m.filter(x=>x.v<0).map(x=>x.v));
    return {ent,sai,saldo:+b.saldo_inicial+ent+sai,entM:sum(m.filter(x=>x.v>0&&x.d.startsWith(mes)).map(x=>x.v)),saiM:sum(m.filter(x=>x.v<0&&x.d.startsWith(mes)).map(x=>x.v)),n:m.length}};
  const bs=S.bancos.filter(b=>emps.some(e=>e.id===b.empresa_id));const C=Object.fromEntries(bs.map(b=>[b.id,calc(b)]));const at=bs.filter(b=>b.ativa!==false);
  const tot=sum(at.map(b=>C[b.id].saldo)),entM=sum(at.map(b=>C[b.id].entM)),saiM=sum(at.map(b=>C[b.id].saiM));
  const tiles=[['Saldo em conta',brl2.format(tot),`<span class="chip ${tot<0?'bad':'good'}">${tot<0?'negativo':'positivo'}</span>`,'saldo inicial + baixas registradas'],
    ['Entradas em '+mesAno(HOJE),brl2.format(entM),'','recebimentos baixados no mês'],['Saídas em '+mesAno(HOJE),brl2.format(-saiM),'','pagamentos baixados no mês'],
    ['Contas ativas',String(at.length),bs.length>at.length?`<span class="chip mute">${bs.length-at.length} inativa${bs.length-at.length>1?'s':''}</span>`:'',emps.length>1?emps.length+' empresas':esc(nomeEmp(emps[0]))]];
  const ed=S.empresas.some(e=>podeEditar(e.id));
  const maxAbs=Math.max(1,...at.map(b=>Math.abs(C[b.id].saldo)));
  let rows='';emps.forEach(e=>{const lb=bs.filter(b=>b.empresa_id===e.id);if(!lb.length&&emps.length>1)return;
    const te=sum(lb.filter(b=>b.ativa!==false).map(b=>C[b.id].saldo));
    if(emps.length>1)rows+=`<tr class="grp-row"><td colspan="6"><span class="emp-cel">${seloEmp(e,20)} ${esc(nomeEmp(e))}</span></td><td class="n ${te<0?'neg':''}">${brl2.format(te)}</td><td></td></tr>`;
    rows+=lb.length?lb.map(b=>{const c=C[b.id];const w=Math.round(Math.abs(c.saldo)/maxAbs*100);const pe=podeEditar(b.empresa_id);
      return `<tr class="${pe?'click':''}" ${pe?`data-acao="editar-banco" data-id="${b.id}"`:''}><td><b>${esc(b.banco_nome)}</b>${b.banco_codigo?` <span class="chip mute mono">${esc(b.banco_codigo)}</span>`:''}<span class="unit">${b.predio_id?esc(predio(b.predio_id)?.nome||''):'empresa toda'}</span></td>
      <td class="mono">${esc(b.agencia)}</td><td class="mono">${esc(b.conta)}</td><td class="n">${brl2.format(+b.saldo_inicial)}<span class="unit">${b.data_saldo_inicial?'em '+dataBR(b.data_saldo_inicial):'sem data'}</span></td>
      <td class="n">${c.ent?brl2.format(c.ent):'–'}</td><td class="n">${c.sai?brl2.format(-c.sai):'–'}</td>
      <td class="n"><div class="bar-cell" style="justify-content:flex-end"><span style="width:${Math.max(w*.6,2)}px;background:${c.saldo<0?'var(--bad)':'var(--accent)'}"></span><b class="${c.saldo<0?'neg':''}">${brl2.format(c.saldo)}</b></div></td>

const INSS_2026=[[1621,.075],[2902.84,.09],[4354.27,.12],[8475.55,.14]];
const IRRF_2026=[[2428.80,0,0],[2826.65,.075,182.16],[3751.05,.15,394.16],[4664.68,.225,675.49],[Infinity,.275,908.73]];
const DEP_IR=189.59,SIMPLIFICADO=607.20;
function calcINSS(b){let t=0,ant=0;const fx=[];for(const [lim,a] of INSS_2026){if(b>ant){const base=Math.min(b,lim)-ant;fx.push({de:ant,ate:Math.min(b,lim),a,base,v:base*a});t+=base*a}ant=lim}return {total:r2(t),fx}}
function impTabela(base){const f=IRRF_2026.find(x=>base<=x[0]);return {f,v:Math.max(0,base*f[1]-f[2])}}
function calcIR(bruto,inss,dep,simplOk=true){
  const bLeg=Math.max(0,bruto-inss-dep*DEP_IR),bSim=Math.max(0,bruto-SIMPLIFICADO);
  const iL=impTabela(bLeg),iS=impTabela(bSim);const usaS=simplOk&&iS.v<iL.v;const it=usaS?iS:iL;
  const red=bruto<=5000?Math.min(it.v,312.89):bruto<=7350?Math.min(it.v,Math.max(0,978.62-0.133145*bruto)):0;
  return {bLeg,bSim,usaS,base:usaS?bSim:bLeg,aliq:it.f[1],ded:it.f[2],tabela:r2(it.v),red:r2(red),total:r2(Math.max(0,it.v-red))}
}
function calcSalario(bruto,dep,outros){
  const i=calcINSS(bruto),ir=calcIR(bruto,i.total,dep);const liq=r2(bruto-i.total-ir.total-outros);
  const i13=calcINSS(bruto),ir13=calcIR(bruto,i13.total,dep,false);const p1=r2(bruto/2),p2=r2(bruto-p1-i13.total-ir13.total);
  return {bruto,inss:i,ir,outros,liq,d13:{p1,p2,inss:i13.total,ir:ir13.total,liq:r2(p1+p2)}}
}

const MESES_ABR={JAN:1,FEV:2,MAR:3,ABR:4,MAI:5,JUN:6,JUL:7,AGO:8,SET:9,OUT:10,NOV:11,DEZ:12};

const somaDias=(iso,n)=>new Date(Date.parse(iso)+n*864e5).toISOString().slice(0,10);
const numBR=s=>{s=String(s).replace(/[R$\s]/g,'');return +s.replace(/\./g,'').replace(',','.')};
function isoDe(s){s=String(s||'').trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];
  m=s.match(/^(\d{2})\/(\d{2})\/(\d{2,4})/);if(m)return (m[3].length===2?'20'+m[3]:m[3])+'-'+m[2]+'-'+m[1];return null}
// texto do histórico sem prefixos genéricos e sem números: vira a "chave" da regra de classificação
const PREFIXOS=/^(TRANSFERENCIA (ENVIADA|RECEBIDA)( PELO PIX)?|TRANSF(ERENCIA)? (ENVIADA|RECEBIDA)|PIX (ENVIADO|RECEBIDO)|COMPRA NO DEBITO( VIA NUPAY)?|COMPRA NO DEBITO|PAGAMENTO DE BOLETO EFETUADO|PAGAMENTO DE FATURA|PAGAMENTO EFETUADO|DEBITO EM CONTA|ESTORNO( DE)?|RESGATE|APLICACAO|DEPOSITO RECEBIDO( POR BOLETO)?|PIX|TED|DOC)\b[\s\-:]*/;
function chaveHist(h){let s=norm(h).replace(/[•*]/g,' ').replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
  for(let i=0;i<3;i++)s=s.replace(PREFIXOS,'').trim();
  return s.split(' ').filter(w=>w.length>1&&!/\d/.test(w)&&!['CPF','CNPJ','AGENCIA','CONTA','BCO','IP','SA','S A','LTDA','ME','EIRELI','DE','DA','DO','DOS','DAS'].includes(w)).slice(0,4).join(' ')}

// ---------- leitores
function lerOFX(t){
  const tag=(b,n)=>{const m=b.match(new RegExp('<'+n+'>([^<\\r\\n]*)','i'));return m?m[1].trim():''};
  const dt=v=>v?v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8):null;
  const linhas=[...t.matchAll(/<STMTTRN>([\s\S]*?)(?:<\/STMTTRN>|(?=<STMTTRN>)|(?=<\/BANKTRANLIST>))/gi)].map(m=>{const b=m[1];
    const nome=tag(b,'NAME'),memo=tag(b,'MEMO');
    return {data:dt(tag(b,'DTPOSTED')),valor:r2(+tag(b,'TRNAMT').replace(',','.')),documento:tag(b,'FITID')||tag(b,'CHECKNUM')||null,historico:[memo,nome&&!memo.includes(nome)?nome:''].filter(Boolean).join(' · ')||tag(b,'TRNTYPE')}}).filter(l=>l.data&&!isNaN(l.valor));
  const bal=t.match(/<LEDGERBAL>[\s\S]*?<BALAMT>([^<\r\n]+)/i);
  return {linhas,saldo:bal?r2(+bal[1].replace(',','.')):null,ini:dt(tag(t,'DTSTART')),fim:dt(tag(t,'DTEND')),formato:'OFX'};
}
function lerCSVExtrato(t){
  const ls=t.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());if(!ls.length)return {linhas:[]};
  const sep=(ls[0].match(/;/g)||[]).length>(ls[0].match(/,/g)||[]).length?';':',';
  const split=l=>{const out=[];let cur='',q=false;for(const c of l){if(c==='"')q=!q;else if(c===sep&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out.map(x=>x.trim())};
  const h=split(ls[0]).map(norm);const col=re=>h.findIndex(x=>re.test(x));
  const cD=col(/^(DATA|DATE)/),cV=col(/^(VALOR|AMOUNT|QUANTIA)/),cH=col(/^(DESCRICAO|HISTORICO|TITLE|LANCAMENTO|DESCRIPTION)/),cI=col(/^(IDENTIFICADOR|ID|DOCUMENTO)$/);
  if(cD<0||cV<0)throw new Error('O CSV precisa ter as colunas Data e Valor (o CSV do Nubank já vem assim).');
  const cartao=h[cD]==='DATE'&&h[cV]==='AMOUNT'; // CSV da fatura do cartão Nubank: valor positivo = gasto
  const linhas=ls.slice(1).map(split).map(c=>{const s=c[cV]||'';let v=/,\d{1,2}$/.test(s)?numBR(s):+s.replace(/[R$\s]/g,'');if(cartao)v=-v;
    return {data:isoDe(c[cD]),valor:r2(v),historico:cH>=0?c[cH]:'',documento:cI>=0?c[cI]||null:null}}).filter(l=>l.data&&!isNaN(l.valor)&&l.valor);
  return {linhas,formato:cartao?'CSV (fatura do cartão)':'CSV'};
}
let pdfPronto=null;
function carregarPdfJs(){if(window.pdfjsLib)return Promise.resolve();if(pdfPronto)return pdfPronto;
  pdfPronto=new Promise((ok,erro)=>{const s=document.createElement('script');s.src='vendor/pdf.min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js';ok()};s.onerror=()=>{pdfPronto=null;erro(new Error('O leitor de PDF não carregou. Verifique a internet e tente de novo.'))};document.head.appendChild(s)});return pdfPronto}
async function textoPDF(buf){
  await carregarPdfJs();const doc=await pdfjsLib.getDocument({data:buf}).promise;const pags=[];
  for(let p=1;p<=doc.numPages;p++){const tc=await (await doc.getPage(p)).getTextContent();const rows=[];
    tc.items.forEach(it=>{const s=it.str;if(!s||!s.trim())return;const y=it.transform[5],x=it.transform[4];let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,its:[]};rows.push(r)}r.its.push({x,s})});
    rows.sort((a,b)=>b.y-a.y);pags.push(rows.map(r=>r.its.sort((a,b)=>a.x-b.x).map(i=>i.s.trim()).join(' ').replace(/\s+/g,' ').trim()))}
  return pags;
}

    const sf=n.match(/^SALDO FINAL DO PERIODO\s*(-)?\s*(?:R\$\s*)?([\d.]+,\d{2})/);if(sf)saldo=(sf[1]?-1:1)*numBR(sf[2]);
    const md=n.match(/^(\d{2}) (JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ) (\d{4})\b\s*/);
    if(md){data=`${md[3]}-${String(MESES_ABR[md[2]]).padStart(2,'0')}-${md[1]}`;l=l.slice(md[0].length).trim();ult=null;sinal=0;if(!l)return}
    const nl=norm(l);
    if(/^TOTAL DE ENTRADAS/.test(nl)){sinal=1;ult=null;return}
    if(/^TOTAL DE SAIDAS/.test(nl)){sinal=-1;ult=null;return}
    if(RE_IGNORA.test(nl)){ult=null;return}
    const mv=l.match(RE_VAL);
    if(mv&&data&&sinal){const hist=l.slice(0,mv.index).trim();if(!hist)return;ult={data,valor:r2(sinal*numBR(mv[2])),historico:hist,documento:null};linhas.push(ult);cont=0;return}
    if(ult&&!mv&&cont<2&&l.length<160){ult.historico+=' '+l;cont++}
  })});
  const MESX={JANEIRO:1,FEVEREIRO:2,MARCO:3,ABRIL:4,MAIO:5,JUNHO:6,JULHO:7,AGOSTO:8,SETEMBRO:9,OUTUBRO:10,NOVEMBRO:11,DEZEMBRO:12};let ini=null,fim=null;
  for(const l of pags.flat()){const m=norm(l).match(/(\d{1,2}) DE ([A-Z]+) DE (\d{4}) A (\d{1,2}) DE ([A-Z]+) DE (\d{4})/);if(m&&MESX[m[2]]&&MESX[m[5]]){const f=(d,me,a)=>`${a}-${String(MESX[me]).padStart(2,'0')}-${d.padStart(2,'0')}`;ini=f(m[1],m[2],m[3]);fim=f(m[4],m[5],m[6]);break}}
  if(linhas.length)return {linhas,saldo,ini,fim,formato:'PDF Nubank'};
  // 2) layout comum de banco: "05/10/2026 HISTÓRICO ... -150,00 [saldo]"
  pags.flat().forEach(l=>{const m=l.match(/^(\d{2}\/\d{2}\/\d{2,4})\s+(.+)$/);if(!m)return;
    const vals=[...m[2].matchAll(/(-\s?)?(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2})\s*([CD](?![A-Z]))?/g)];if(!vals.length)return;
    const v=vals[0];const hist=m[2].slice(0,v.index).trim();if(!hist||/^SALDO/i.test(norm(hist)))return;
    linhas.push({data:isoDe(m[1]),valor:r2((v[1]||v[3]==='D'?-1:1)*numBR(v[2])),historico:hist,documento:null})});
  return {linhas,saldo,formato:'PDF'};
}
async function lerArquivoExtrato(f){
  const nome=f.name.toLowerCase();
  if(nome.endsWith('.ofx')||nome.endsWith('.qfx'))return lerOFX(await f.text());
  if(nome.endsWith('.csv'))return lerCSVExtrato(await f.text());
  if(nome.endsWith('.pdf')){const pags=await textoPDF(new Uint8Array(await f.arrayBuffer()));
    if(!pags.flat().length)throw new Error('Este PDF não tem texto (parece uma imagem ou foto). Baixe o extrato direto no app do banco, em PDF, OFX ou CSV.');
    const r=lerTextoExtrato(pags);if(!r.linhas.length)throw new Error('Não encontrei movimentações neste PDF. Envie o extrato em OFX ou CSV, ou mande este PDF para ajustarmos a leitura.');return r}
  throw new Error('Formato não aceito. Envie .ofx, .csv ou .pdf.');
}

const stExt=()=>S.ext||(S.ext={emp:null,banco:null,prev:null,aberto:null,sel:new Set(),contas:{}});
function sugerirConta(hist,empId,regras){
  const n=norm(hist),ch=chaveHist(hist);
  const r=regras.filter(r=>(!r.empresa_id||r.empresa_id===empId)&&r.padrao&&(n.includes(r.padrao)||ch&&ch===r.padrao)).sort((a,b)=>b.padrao.length-a.padrao.length||b.vezes_usada-a.vezes_usada)[0];
  if(r&&conta(r.conta_id))return {conta_id:r.conta_id,confianca:'alta',motivo:'regra aprendida: '+r.padrao};
  const cts=S.contas.filter(c=>c.empresa_id===empId&&c.analitica&&c.ativa!==false);
  const acha=re=>cts.find(c=>re.test(norm(c.nome)));
  const KW=[[/TARIFA|PACOTE DE SERVICOS|MENSALIDADE CONTA/,/TARIFA/],[/\bIOF\b/,/IOF|TARIFA/],[/RENDIMENTO|REMUNERACAO/,/RENDIMENTO|RECEITA FINANCEIRA|APLICAC/],[/JUROS/,/JUROS/],
    [/SALARIO|FOLHA|PAGTO SAL/,/SALARIO/],[/ALUGUEL/,/ALUGUEL/],[/ENERGIA|ENEL|CEMIG|COPEL|CPFL|LIGHT|EQUATORIAL|NEOENERGIA/,/ENERGIA|LUZ/],[/SABESP|COPASA|SANEAGO|AGUA/,/AGUA/],
    [/INTERNET|VIVO|CLARO|TIM |OI /,/INTERNET|TELEFON/],[/POSTO|COMBUST|SHELL|IPIRANGA|PETROBRAS/,/COMBUST/],[/MERCADO|SUPERMERC|ATACAD|ASSAI|CARREFOUR/,/\bMERCADO\b|SUPERMERCADO|ALIMENTA/],
    [/FARMACIA|DROGA|RAIA|PAGUE MENOS/,/FARMACIA|SAUDE|MEDIC/],[/IFOOD|RESTAUR|LANCHONETE|PADARIA/,/ALIMENTA|REFEI/],[/UBER|99 ?APP|99POP/,/TRANSPORTE/],[/DAS |SIMPLES NACIONAL|DARF|RECEITA FEDERAL/,/IMPOSTO|DAS|TRIBUT/]];
  for(const [re,rc] of KW)if(re.test(n)){const c=acha(rc);if(c)return {conta_id:c.id,confianca:'media',motivo:'pela palavra no histórico'}}
  return null;
}
async function dadosConciliacao(empId,bancoId,ini,fim){
  const [pagas,abertas,regras,exts]=await Promise.all([
    todos(()=>sb.from('parcelas').select('id,valor,valor_pago,data_pagamento,vencimento,conta_bancaria_id,lancamento_id,lancamentos(descricao,conta_id,parceiro_id)').eq('empresa_id',empId).eq('status','paga').gte('data_pagamento',somaDias(ini,-5)).lte('data_pagamento',somaDias(fim,5))),
    todos(()=>sb.from('parcelas').select('id,valor,vencimento,conta_bancaria_id,lancamento_id,lancamentos(descricao,conta_id,parceiro_id)').eq('empresa_id',empId).eq('status','aberta').gte('vencimento',somaDias(ini,-20)).lte('vencimento',somaDias(fim,20))),
    sb.from('regras_classificacao').select('*').then(r=>r.data||[]),
    sb.from('extratos').select('id').eq('conta_bancaria_id',bancoId).then(r=>(r.data||[]).map(x=>x.id))]);
  let usadas=[];for(let i=0;i<exts.length;i+=100){const {data,error}=await sb.from('extrato_linhas').select('id,extrato_id,data,valor,documento,historico,parcela_id').in('extrato_id',exts.slice(i,i+100));if(error)throw error;usadas=usadas.concat(data)}
  return {pagas:pagas.filter(p=>!p.conta_bancaria_id||p.conta_bancaria_id===bancoId),abertas:abertas.filter(p=>!p.conta_bancaria_id||p.conta_bancaria_id===bancoId),regras,ja:usadas};
}
// procura a baixa do sistema (parcela paga) ou a conta em aberto que corresponde a cada linha do extrato
function casar(linhas,D,ignorarExtrato){
  const usadas=new Set(D.ja.filter(x=>x.parcela_id&&x.extrato_id!==ignorarExtrato).map(x=>x.parcela_id));
  const ord=[...linhas].sort((a,b)=>a.data.localeCompare(b.data));const res=new Map();
  ord.forEach(l=>{if(l.parcela_id){usadas.add(l.parcela_id);return}});
  ord.forEach(l=>{if(l.parcela_id||l.status==='ignorado'||l.status==='lancado_na_auditoria')return;
    const pv=p=>+(p.valor_pago??p.valor);
    let p=D.pagas.filter(p=>!usadas.has(p.id)&&Math.abs(pv(p)-l.valor)<0.005&&Math.abs(dias(p.data_pagamento,l.data))<=3).sort((a,b)=>Math.abs(dias(a.data_pagamento,l.data))-Math.abs(dias(b.data_pagamento,l.data)))[0];
    if(p){usadas.add(p.id);res.set(l,{tipo:'conciliado',p});return}
    p=D.pagas.filter(p=>!usadas.has(p.id)&&Math.sign(pv(p))===Math.sign(l.valor)&&dias(p.data_pagamento,l.data)===0&&Math.abs(pv(p)-l.valor)<=Math.max(1,Math.abs(l.valor)*0.05)&&(!p.lancamentos?.descricao||chaveHist(p.lancamentos.descricao)&&norm(l.historico).includes(chaveHist(p.lancamentos.descricao).split(' ')[0])))[0];
    if(p){usadas.add(p.id);res.set(l,{tipo:'valor_diferente',p,dif:r2(l.valor-pv(p))});return}
    p=D.abertas.filter(p=>!usadas.has(p.id)&&Math.abs(+p.valor-l.valor)<0.005&&Math.abs(dias(p.vencimento,l.data))<=15).sort((a,b)=>Math.abs(dias(a.vencimento,l.data))-Math.abs(dias(b.vencimento,l.data)))[0];
    if(p){usadas.add(p.id);res.set(l,{tipo:'aberta',p})}});
  return res;
}
const chaveLinha=l=>l.documento?'d|'+l.documento:`h|${l.data}|${r2(l.valor).toFixed(2)}|${chaveHist(l.historico)}`;

async function lerExtratoEnviado(f){
  const E=stExt();if(!E.banco){toast('Escolha a conta bancária antes de enviar o extrato.');return}
  E.lendo=f.name;render(true);
  try{const r=await lerArquivoExtrato(f);
    if(!r.linhas.length)throw new Error('O arquivo não tem movimentações.');
    const datas=r.linhas.map(l=>l.data).sort();const ini=r.ini&&r.ini<=datas[0]?r.ini:datas[0],fim=r.fim&&r.fim>=datas.at(-1)?r.fim:datas.at(-1);
    const D=await dadosConciliacao(E.emp,E.banco,ini,fim);
    const ja=new Set(D.ja.map(chaveLinha));
    const lin=r.linhas.map(l=>({...l,dup:ja.has(chaveLinha(l))}));
    const novas=lin.filter(l=>!l.dup);const cas=casar(novas,D);
    novas.forEach(l=>{const c=cas.get(l);l.match=c||null;if(!c||c.tipo==='aberta'){const s=sugerirConta(l.historico,E.emp,D.regras);l.sug=s}});
    E.prev={nome:f.name,formato:r.formato,saldo:r.saldo,ini,fim,lin};E.aberto=null;
  }catch(err){console.error(err);toast(err.message||traduz(err))}
  finally{E.lendo=null;render(true)}
}

async function abrirExtratoSalvo(id){
  const {data:x,error}=await sb.from('extratos').select('*').eq('id',id).single();if(error)throw error;
  const {data:ls,error:e2}=await sb.from('extrato_linhas').select('*').eq('extrato_id',id).order('data');if(e2)throw e2;
  const D=await dadosConciliacao(x.empresa_id,x.conta_bancaria_id,x.periodo_inicio||ls[0]?.data||HOJE,x.periodo_fim||ls.at(-1)?.data||HOJE);
  const pend=ls.filter(l=>l.status==='nao_lancado');const cas=casar(pend,D,id);
  const todasParc=new Map([...D.pagas,...D.abertas].map(p=>[p.id,p]));
  pend.forEach(l=>{const c=cas.get(l);if(c)l.match=c;if(!l.conta_sugerida_id){const s=sugerirConta(l.historico,x.empresa_id,D.regras);if(s){l.conta_sugerida_id=s.conta_id;l.confianca=s.confianca;l.motivo_sugestao=s.motivo}}});
  ls.forEach(l=>{if(l.parcela_id)l.parc=todasParc.get(l.parcela_id)||null});

}

async function lancarLinhas(){

  const x=(await sb.from('extratos').select('empresa_id,conta_bancaria_id').eq('id',E.aberto).single()).data;
  const L=[],P=[],up=[];
  ls.forEach(l=>{const cid=E.contas[l.id]??l.conta_sugerida_id;const id=uuid(),pid=uuid();const v=r2(+l.valor);
    L.push({id,empresa_id:x.empresa_id,conta_id:cid,competencia:l.data,descricao:l.historico.slice(0,300),valor:v,origem:'manual'});

    up.push([l,pid,cid])});
  for(let i=0;i<L.length;i+=300){const {error}=await sb.from('lancamentos').insert(L.slice(i,i+300));if(error)throw error;const {error:e2}=await sb.from('parcelas').insert(P.slice(i,i+300));if(e2)throw e2}
  for(let i=0;i<up.length;i+=20)await Promise.all(up.slice(i,i+20).map(([l,pid,cid])=>sb.from('extrato_linhas').update({status:'lancado_na_auditoria',parcela_id:pid,conta_sugerida_id:cid}).eq('id',l.id).then(r=>{if(r.error)throw r.error})));
  // aprende: histórico -> conta

    if(r){await sb.from('regras_classificacao').update({conta_id:cid,vezes_usada:(r.vezes_usada||0)+1}).eq('id',r.id);r.conta_id=cid;r.vezes_usada++}

  if(novas.size)await sb.from('regras_classificacao').insert([...novas.values()]);
  E.sel=new Set();E.contas={};invalidar();toast(`${ls.length} lançamento${ls.length>1?'s':''} criado${ls.length>1?'s':''} e conciliado${ls.length>1?'s':''}.`);render(true);
}

// Férias: período aquisitivo de 12 meses a partir da admissão; 30 dias para sair até 12 meses depois (período concessivo).
// Os dias de férias (mais o abono vendido) abatem os períodos mais antigos primeiro.
function feriasDe(c,aus){
  const fimRef=c.desligamento||HOJE,pers=[];
  for(let k=0;k<60;k++){const ini=addAnos(c.admissao,k);if(ini>fimRef)break;const fim=addDias(addAnos(c.admissao,k+1),-1);pers.push({ini,fim,limite:addDias(addAnos(c.admissao,k+2),-1),gozado:c.ferias_quitadas_ate&&fim<=c.ferias_quitadas_ate?30:0,completo:fim<HOJE})}
  aus.filter(a=>a.colaborador_id===c.id&&a.tipo==='ferias'&&a.status!=='recusada').sort((x,y)=>x.inicio.localeCompare(y.inicio)).forEach(f=>{let d=f.dias+(f.abono_dias||0);for(const p of pers){if(d<=0)break;const t=Math.min(30-p.gozado,d);p.gozado+=t;d-=t}});
  const pend=pers.filter(p=>p.completo&&p.gozado<30).map(p=>({...p,saldo:30-p.gozado,sit:p.limite<HOJE?'vencida':p.limite<=addDias(HOJE,60)?'vence':'ok'}));
  const atual=pers.find(p=>!p.completo);const meses=atual?Math.floor(diasEntre(atual.ini,HOJE)/30.4):0;
  return {pend,atual,proporcional:atual?Math.max(0,Math.min(30,Math.floor(meses*2.5))-atual.gozado):0,vencidas:pend.filter(p=>p.sit==='vencida').length,vence:pend.filter(p=>p.sit==='vence').length}}
function chipFerias(fe){if(fe.vencidas)return `<span class="chip bad">${fe.vencidas>1?fe.vencidas+' férias vencidas':'Férias vencidas'}</span>`;if(fe.vence)return '<span class="chip warn">Vence em até 60 dias</span>';if(fe.pend.length)return '<span class="chip info">Com saldo</span>';return '<span class="chip good">Em dia</span>'}
function situacaoColab(c,aus){if(c.desligamento&&c.desligamento<HOJE)return '<span class="chip mute">Desligado</span>';if(c.admissao>HOJE)return '<span class="chip info">Admissão futura</span>';const a=ausAtiva(aus,c);if(a){const t=TIPOS_AUS[a.tipo];return `<span class="chip ${t[2]}">${a.tipo==='ferias'?'Em férias':t[0]}</span>`}return '<span class="chip good">Ativo</span>'}
function semTabelasPessoas(){return vazio('Gestão de pessoas quase pronta','<p style="margin:0 auto;max-width:60ch">As telas já estão aqui, mas o banco de dados ainda precisa da atualização com as tabelas de departamentos, colaboradores e ausências.</p>')}

function chartAus(labels,series){
  const W=640,H=230,L=40,R_=12,T=14,B=28,iw=W-L-R_,ih=H-T-B;const tot=labels.map((_,i)=>sum(series.map(s=>s.vals[i])));
  const max=Math.max(4,...tot)*1.1,n=labels.length,bw=iw/n,y=v=>T+ih-(v/max)*ih,step=Math.max(1,niceStep(max/4));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Dias de ausência por mês e tipo">`;
  for(let t=0;t<=max;t+=step)s+=`<line x1="${L}" x2="${W-R_}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${t}</text>`;
  labels.forEach((l,i)=>{let base=0;series.forEach(se=>{const v=se.vals[i];if(!v)return;s+=`<rect x="${L+i*bw+bw*.2}" y="${y(base+v)}" width="${bw*.6}" height="${y(base)-y(base+v)}" fill="${se.cor}" stroke="var(--surface)" stroke-width="1"><title>${l} · ${se.nome}: ${v} dia${v>1?'s':''}</title></rect>`;base+=v});
    s+=`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${l}</text>`});
  return s+'</svg>'}

    const d={nome:f.nome.value.trim(),cpf:cpf||null,cargo:f.cargo.value.trim()||null,departamento_id:f.depto.value||null,predio_id:f.unidade.value||null,admissao:f.admissao.value,contrato:f.contrato.value,salario:sal==null?null:r2(sal),nascimento:f.nascimento.value||null,email:f.email.value.trim()||null,telefone:f.telefone.value.trim()||null,desligamento:f.desligamento.value||null,ferias_quitadas_ate:f.quitadas.value||null,observacao:f.obs.value.trim()||null};

  async aus(f){

    if(choque&&f.status.value!=='recusada')return toast(`Já existe ${TIPOS_AUS[choque.tipo][0].toLowerCase()} de ${dataBR(choque.inicio)} a ${dataBR(choque.fim)} para esta pessoa.`);

    if(error)throw error;await carregarDeptos();S.usuarios=null;fecharDrawer();toast('Departamento salvo.');render(true)},
};

<script>
// ===================== navegação e filtros
const ROTAS=[
['g','Visão geral'],['painel','Painel'],['dre','DRE'],['faturamento','Faturamento e impostos'],['fluxo','Fluxo de caixa'],['contas','Contas a pagar e receber'],['boletos','Boletos do e-mail'],['lancamentos','Lançamentos'],
 ['g','Controle'],['auditoria','Extratos e conciliação'],['nfs','Notas fiscais',1],['estoque','Estoque',1],
 ['g','Planejamento'],['orcamento','Orçamento e forecast'],['premissas','Premissas de prazo'],['salario','Salário líquido (PF)'],
 ['g','Cadastros'],['plano','Plano de contas'],['empresas','Empresas e unidades'],['bancos','Contas bancárias'],['tributos','Impostos e maquininha'],['importar','Importar dados antigos'],['usuarios','Usuários'],

const USA_PERIODO=new Set(['painel','dre','lancamentos','faturamento']),USA_ANO=new Set(['painel','dre','lancamentos','fluxo','faturamento','pessoas','ausencias']),USA_EMP=new Set(['painel','dre','lancamentos','fluxo','contas','boletos','faturamento','pessoas','ausencias']);

  document.getElementById('sideFoot').innerHTML=`<div style="display:flex;flex-direction:column;gap:4px"><span style="overflow-wrap:anywhere">${esc(S.perfil?.nome||'')}${S.master?' · master':''}<br>${esc(S.user?.email||'')}</span>${S.empresas.length>1?'<span><button class="linkbtn small" data-acao="trocar-empresa" style="color:var(--side-ink)">Trocar empresa</button></span>':''}<span><button class="linkbtn small" data-acao="alterar-senha" style="color:var(--side-ink)">Alterar senha</button> · <button class="linkbtn small" data-acao="sair" style="color:var(--side-ink)">Sair</button></span></div>`;
}
function txtFiltro(){const es=selEmp(),us=selUn(),all=unidades();if(!S.empresas.length)return 'Sem empresas';
  return es.length===S.empresas.length&&us.length===all.length?(S.empresas.length>1?`Todas as empresas <small>${S.empresas.length} empresas · ${S.predios.length} unidades</small>`:esc(nomeEmp(es[0]))+' <small>todas as unidades</small>'):es.length===1?`${esc(nomeEmp(es[0]))} <small>${us.length} unidade${us.length>1?'s':''}</small>`:`${es.map(e=>esc(nomeEmp(e))).join(' + ')} <small>${us.length} unidades</small>`}
function renderPop(){

  document.getElementById('popLayer').innerHTML=`<div class="pop" id="pop" style="top:${b.bottom+scrollY+6}px;left:${left}px;max-height:70vh;overflow:auto">
   ${S.empresas.map(e=>{const us=unidades().filter(u=>u.emp===e);const on=us.filter(u=>S.sel.has(u.key)).length;return `<div class="grp"><label><input type="checkbox" data-fe="${e.id}" ${on===us.length?'checked':''} ${on&&on<us.length?'data-ind="1"':''}><b>${esc(nomeEmp(e))}</b></label>
     ${us.length>1?us.map(u=>`<label class="sub"><input type="checkbox" data-fu="${u.key}" ${S.sel.has(u.key)?'checked':''}>${esc(u.nome)}</label>`).join(''):''}</div>`}).join('')}
   <div class="acts"><button class="linkbtn" data-acao="sel-todas">Marcar todas</button><button class="btn" data-acao="pop-fechar">Pronto</button></div></div>`;
  document.querySelectorAll('#pop [data-ind]').forEach(x=>x.indeterminate=true);
  document.getElementById('fEmp').setAttribute('aria-expanded','true');
}
function fecharPop(){document.getElementById('popLayer').innerHTML='';document.getElementById('fEmp').setAttribute('aria-expanded','false')}
function setSel(keys,on){const n=new Set(S.sel);keys.forEach(i=>on?n.add(i):n.delete(i));if(!n.size){toast('Deixe pelo menos uma unidade marcada.');return false}S.sel=n;return true}
function renderFiltros(r){
  document.getElementById('fEmpTxt').innerHTML=txtFiltro();
  document.getElementById('fEmp').hidden=!USA_EMP.has(r)||!S.empresas.length;document.getElementById('fMais').hidden=!USA_EMP.has(r)||!S.empresas.length;atualizaFxBtn();

  fT.hidden=!USA_PERIODO.has(r);fT.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.per===S.per.tipo));
  fP.hidden=!USA_PERIODO.has(r)||S.per.tipo==='ano';

}
let renderSeq=0;
async function render(quieto){
  const r=rota(),seq=++renderSeq;renderNav(r);renderFiltros(r);marcaPelaSelecao();
  document.getElementById('title').textContent=TITULOS[r];
  document.getElementById('subtitle').textContent=USA_EMP.has(r)&&S.empresas.length?escopo()+(USA_PERIODO.has(r)?' · '+labelPer():USA_ANO.has(r)?' · '+S.ano:''):'';
  const v=document.getElementById('view');
  if(EM_BREVE[r]){v.innerHTML=vEmBreve(r);return}
  if(!S.empresas.length&&!['empresas','usuarios'].includes(r)){v.innerHTML=semEmpresa();return}
  if(!quieto)v.classList.add('loading');
  try{const html=await VIEWS[r]();if(seq!==renderSeq)return;v.innerHTML=html;decorarTiles(v);v.querySelectorAll('.om-mes.on,.versions.orc-vers .ver.on').forEach(e=>{const p=e.parentElement;p.scrollLeft=e.offsetLeft-p.offsetLeft-(p.clientWidth-e.offsetWidth)/2})}
  catch(err){if(seq!==renderSeq)return;console.error(err);v.innerHTML=vazio('Não consegui carregar esta tela',`<p style="margin:0">${esc(traduz(err))}</p>`,'<button class="btn" data-acao="recarregar">Tentar de novo</button>')}
  finally{if(seq===renderSeq)v.classList.remove('loading')}
}
function drawer(html){document.getElementById('layer').innerHTML=`<div class="drawer" data-fundo="1"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;const f=document.querySelector('.sheet input:not([readonly]):not([type=hidden]),.sheet select');f?.focus()}
const fecharDrawer=()=>document.getElementById('layer').innerHTML='';

// ===================== login e senha
function telaAuth(modo,aviso=''){
  document.getElementById('app').hidden=true;const a=document.getElementById('auth');a.hidden=false;
  const msg=aviso?`<div class="msg ${aviso.startsWith('✓')?'ok':'err'}" role="status">${esc(aviso.replace(/^✓ ?/,''))}</div>`:'';
  const marca=`<div class="brand" style="padding:0">${LOGO}<div><b style="color:var(--ink)">${APP_NOME}</b><small style="color:var(--ink-2)">${APP_SUB} · gestão financeira multiempresa</small></div></div>`;
  const T={
    login:`<h1>Entrar</h1>${ultimaMarca()}${msg}<form data-form="login" style="display:flex;flex-direction:column;gap:12px">
      <div class="field"><label for="aEmail">E-mail</label><input id="aEmail" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="aSenha">Senha</label><input id="aSenha" name="senha" type="password" autocomplete="current-password" required></div>
      <button class="btn">Entrar</button></form>
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><button class="linkbtn small" data-auth="esqueci">Esqueci minha senha</button><button class="linkbtn small" data-auth="primeiro">Primeiro acesso da conta master</button></div>
      <p>O acesso é por convite. Se você recebeu um convite por e-mail, use o link dele para criar sua senha.</p>`,
    esqueci:`<h1>Recuperar senha</h1>${msg}<p>Enviaremos um link para você criar uma nova senha.</p><form data-form="esqueci" style="display:flex;flex-direction:column;gap:12px">
      <div class="field"><label for="aEmail">E-mail</label><input id="aEmail" name="email" type="email" required></div><button class="btn">Enviar link</button></form><button class="linkbtn small" data-auth="login">Voltar para o login</button>`,
    primeiro:`<h1>Primeiro acesso da conta master</h1>${msg}<p>Use só uma vez, para criar a senha da conta master. Os demais usuários entram por convite.</p><form data-form="primeiro" style="display:flex;flex-direction:column;gap:12px">
      <div class="field"><label for="aEmail">E-mail da conta master</label><input id="aEmail" name="email" type="email" required value="${esc(MASTER_EMAIL)}"></div>
      <div class="field"><label for="aSenha">Crie uma senha</label><input id="aSenha" name="senha" type="password" minlength="8" autocomplete="new-password" required></div>
      <div class="field"><label for="aSenha2">Repita a senha</label><input id="aSenha2" name="senha2" type="password" minlength="8" autocomplete="new-password" required></div>
      <button class="btn">Criar acesso</button></form><button class="linkbtn small" data-auth="login">Voltar para o login</button>`,
    senha:`<h1>${LINK_TIPO==='invite'?'Bem-vindo! Crie sua senha':'Crie uma nova senha'}</h1>${msg}<form data-form="definir" style="display:flex;flex-direction:column;gap:12px">
      <div class="field"><label for="aSenha">Nova senha (mínimo 8 caracteres)</label><input id="aSenha" name="senha" type="password" minlength="8" autocomplete="new-password" required></div>
      <div class="field"><label for="aSenha2">Repita a senha</label><input id="aSenha2" name="senha2" type="password" minlength="8" autocomplete="new-password" required></div>
      <button class="btn">Salvar senha e entrar</button></form>`,
    erro:`<h1>Não foi possível abrir o app</h1>${msg}<p>Verifique sua conexão e recarregue a página.</p>`,
  };
  a.innerHTML=`<div class="auth-card">${marca}${T[modo]}</div>`;
  a.querySelector('input:not([readonly])')?.focus();

async function entrar(user){
  S.user=user;
  const {data:perfil,error}=await sb.from('perfis').select('*').eq('usuario_id',user.id).maybeSingle();
  if(error){telaAuth('login',traduz(error));return}
  if(perfil&&!perfil.ativo){await sb.auth.signOut();telaAuth('login','Seu acesso foi desativado. Fale com o administrador.');return}
  S.perfil=perfil;S.master=!!perfil?.master;S.pes=null;S.usuarios=null;
  document.getElementById('auth').hidden=true;document.getElementById('app').hidden=false;
  document.getElementById('brandLogo').innerHTML=LOGO;document.getElementById('brandSub').textContent=S.master?APP_SUB+' · master':APP_SUB;
  document.getElementById('view').innerHTML='<div class="panel empty">Carregando…</div>';
  try{await carregarCadastros();await carregarAnos()}catch(err){document.getElementById('view').innerHTML=vazio('Não consegui carregar os cadastros',`<p style="margin:0">${esc(traduz(err))}</p>`,'<button class="btn" data-acao="recarregar-tudo">Tentar de novo</button>');return}
  if(!S.empresas.length&&S.master&&!location.hash)location.hash='empresas';
  await escolherEmpresa();

}
async function iniciar(){
  if(!sb){telaAuth('erro','A biblioteca de acesso ao banco não carregou.');return}
  if(window.DEMO){document.getElementById('filtros').insertAdjacentHTML('afterbegin','<span class="demo">Demonstração · dados fictícios</span>');const {data,error}=await sb.auth.signInWithPassword({email:MASTER_EMAIL,password:'demo'});if(!error)return entrar(data.user)}
  const {data:{session}}=await sb.auth.getSession();
  if(/access_token|error_description/.test(location.hash))history.replaceState(null,'',BASE_URL);
  if(LINK_ERRO){telaAuth('login',/expired|invalid/i.test(decodeURIComponent(LINK_ERRO))?'O link do e-mail expirou ou já foi usado. Peça um novo em “Esqueci minha senha”.':decodeURIComponent(LINK_ERRO.replace(/\+/g,' ')));return}
  if(session&&(LINK_TIPO==='invite'||LINK_TIPO==='recovery')){telaAuth('senha');return}
  if(session)entrar(session.user);else telaAuth('login',LINK_TIPO==='signup'?'✓ E-mail confirmado. Entre com sua senha.':'');
  sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY')telaAuth('senha');if(ev==='SIGNED_OUT'){S.user=null;telaAuth('login')}});
}

// ===================== formulários
const busy=(form,on)=>{const b=form.querySelector('button:not([type=button])');if(b){b.disabled=on;if(on){b.dataset.t=b.textContent;b.textContent='Aguarde…'}else if(b.dataset.t)b.textContent=b.dataset.t}};
async function recarregarCad(){await carregarCadastros();render()}
const FORMS={
  async login(f){const {data,error}=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.senha.value});if(error)return telaAuth('login',traduz(error));entrar(data.user)},
  async esqueci(f){const {error}=await sb.auth.resetPasswordForEmail(f.email.value.trim(),{redirectTo:BASE_URL});telaAuth(error?'esqueci':'login',error?traduz(error):'✓ Se o e-mail estiver cadastrado, você vai receber um link em instantes. Confira também o spam.')},
  async primeiro(f){
    if(f.senha.value!==f.senha2.value)return telaAuth('primeiro','As senhas não são iguais.');
    if(f.email.value.trim().toLowerCase()!==MASTER_EMAIL)return telaAuth('primeiro','Este caminho é só para a conta master. Outros usuários entram pelo convite.');
    const {data,error}=await sb.auth.signUp({email:f.email.value.trim(),password:f.senha.value,options:{emailRedirectTo:BASE_URL}});
    if(error)return telaAuth('primeiro',traduz(error));
    if(data.session)return entrar(data.user);

  async definir(f){if(f.senha.value!==f.senha2.value)return telaAuth('senha','As senhas não são iguais.');
    const {data,error}=await sb.auth.updateUser({password:f.senha.value});if(error)return telaAuth('senha',traduz(error));toast('Senha salva.');entrar(data.user)},
  async 'senha-nova'(f){if(f.senha.value!==f.senha2.value)return toast('As senhas não são iguais.');const {error}=await sb.auth.updateUser({password:f.senha.value});if(error)return toast(traduz(error));fecharDrawer();toast('Senha alterada.')},
  async lanc(f){
    const emp=f.empresa.value,c=conta(f.conta.value);let v=parseValor(f.valor.value);

    if(pn){const p=S.parceiros.find(x=>x.empresa_id===emp&&norm(x.nome)===norm(pn));if(p)parcId=p.id;else{const {data,error}=await sb.from('parceiros').insert({empresa_id:emp,nome:pn,cliente:v>0,fornecedor:v<0}).select('id,empresa_id,documento,nome').single();if(error)throw error;S.parceiros.push(data);parcId=data.id}}
    const id=uuid();
    const L={id,empresa_id:emp,predio_id:f.predio.value||null,conta_id:c.id,centro_custo_id:f.centro.value||null,parceiro_id:parcId,competencia:f.competencia.value,descricao:[f.documento.value.trim(),f.descricao.value.trim()].filter(Boolean).join(' · ')||null,valor:v};
    const {error}=await sb.from('lancamentos').insert(L);
    if(error)throw error;
    const pago=f.pagamento.value;
    const P={empresa_id:emp,lancamento_id:id,numero:1,vencimento:f.vencimento.value||pago||f.competencia.value,valor:v,data_pagamento:pago||null,valor_pago:pago?v:null,forma_pagamento:f.forma.value.trim()||null,status:pago?'paga':'aberta',conta_bancaria_id:f.banco.value||null,centro_custo_id:f.centro.value||null};
    const {error:e2}=await sb.from('parcelas').insert(P);
    if(e2)throw e2;
    if(f.boleto){const {error:e3}=await sb.from('boletos_email').update({status:'lancado',lancamento_id:id}).eq('id',f.boleto.value);if(e3)throw e3;invalidar();await carregarAnos();fecharDrawer();toast('Boleto lançado em contas a pagar.');render();return}
    invalidar();await carregarAnos();render();perguntarReplicar(L,P)},
  async baixa(f){const ab=await S.parcAbertas;const p=ab.find(x=>x.id===f.dataset.id);let v=parseValor(f.valor.value);if(isNaN(v)||!v)return toast('Informe o valor pago.');
    const {error}=await sb.from('parcelas').update({status:'paga',data_pagamento:f.data.value,valor_pago:r2(Math.abs(v)*Math.sign(p.valor)),conta_bancaria_id:f.banco.value||null,forma_pagamento:f.forma.value.trim()||null}).eq('id',p.id);
    if(error)throw error;invalidar();fecharDrawer();toast('Baixa registrada.');render()},
  async conta(f){const id=f.dataset.id;const pai=f.pai.value||null;
    const dados={nome:f.nome.value.trim(),tipo:f.tipo.value,grupo_dre:f.grupo.value||null,analitica:f.analitica.value==='1',conta_pai:pai};
    if(id&&pai===id)return toast('A conta não pode ficar abaixo dela mesma.');
    const cod=f.codigo.value.trim();if(S.contas.some(c=>c.empresa_id===f.empresa.value&&c.codigo===cod&&c.id!==id))return toast('Já existe uma conta com o código '+cod+'.');
    if(id){dados.ativa=f.ativa.checked;dados.codigo=cod;const {error}=await sb.from('plano_contas').update(dados).eq('id',id);if(error)throw error}
    else{const {error}=await sb.from('plano_contas').insert({...dados,ativa:true,empresa_id:f.empresa.value,codigo:cod});if(error)throw error}
    fecharDrawer();toast('Conta salva.');await recarregarCad()},
  async empresa(f){await criarEmpresaPadrao(f)},
  async 'dados-emp'(f){const id=f.dataset.emp,pf=f.dataset.tipo==='pf';
    const row={razao_social:f.razao.value.trim(),nome_fantasia:f.fantasia.value.trim()||null};
    if(!pf){row.regime_tributario=f.regime.value||null;row.atividade=f.atividade.value||null}
    if(S.master&&f.doc){const d=soDig(f.doc.value);if(d.length!==(pf?11:14)&&!(pf&&d.length===14))return toast(pf?'O CPF precisa ter 11 dígitos.':'O CNPJ precisa ter 14 dígitos.');row.cnpj=d}
    const {error}=await sb.from('empresas').update(row).eq('id',id);if(error)throw error;
    fecharDrawer();toast('Dados da empresa salvos.');await recarregarCad();S._marca=null;marcaPelaSelecao()},
  async predio(f){const {error}=await sb.from('predios').insert({empresa_id:f.dataset.emp,nome:f.nome.value.trim(),endereco:f.endereco.value.trim()||null});if(error)throw error;fecharDrawer();toast('Unidade cadastrada.');await recarregarCad()},
  async banco(f){const s=parseValor(f.saldo.value);const {error}=await sb.from('contas_bancarias').insert({empresa_id:f.dataset.emp,banco_nome:f.banco.value.trim(),banco_codigo:f.codigo.value.trim()||null,agencia:f.agencia.value.trim(),conta:f.conta.value.trim(),predio_id:f.predio.value||null,saldo_inicial:isNaN(s)?0:s,data_saldo_inicial:f.data.value||null});if(error)throw error;fecharDrawer();toast('Conta bancária cadastrada.');await recarregarCad()},
  async centro(f){const {error}=await sb.from('centros_custo').insert({empresa_id:f.dataset.emp,codigo:f.codigo.value.trim().toUpperCase(),nome:f.nome.value.trim(),responsavel:f.responsavel.value.trim()||null});if(error)throw error;fecharDrawer();toast('Centro de custo cadastrado.');await recarregarCad()},
};

document.addEventListener('click',async ev=>{
  if(document.getElementById('pop')&&!ev.target.closest('#pop')&&!ev.target.closest('#fEmp'))fecharPop();
  if(ev.target.dataset?.fundo){fecharDrawer();return}
  const au=ev.target.closest('[data-auth]');if(au){telaAuth(au.dataset.auth);return}
  const per=ev.target.closest('[data-per]');if(per){const t=per.dataset.per,hm=+HOJE.slice(5,7)-1,base=S.per.tipo==='mes'?S.per.v:S.per.tipo==='tri'?3*S.per.v:(S.ano===+HOJE.slice(0,4)?hm:11);
    S.per={tipo:t,v:t==='tri'?Math.floor(base/3):t==='mes'?base:0};render();return}
  const dr=ev.target.closest('[data-dre]');if(dr){S.dreModo=dr.dataset.dre;render(true);return}
  const ab=ev.target.closest('[data-abre]');if(ab){const k_=ab.dataset.abre;S.abertos.has(k_)?S.abertos.delete(k_):S.abertos.add(k_);render(true);return}
  const pf=ev.target.closest('[data-pesfiltro]');if(pf){S.pesFiltro=pf.dataset.pesfiltro;render(true);return}
  const cp=ev.target.closest('[data-cp]');if(cp){S.cpLado=cp.dataset.cp;render(true);return}
  const vb=ev.target.closest('[data-ver]');if(vb){if(S.orcEdit?.sujo){toast('Há valores não salvos. Salve antes de trocar de versão.');return}S.orcVer=vb.dataset.ver;S.orcEdit=null;S.acOrc=S.acFc=null;render(true);return}
  const ot=ev.target.closest('[data-orctab]');if(ot){S.orcTab=ot.dataset.orctab;render(true);return}
  const om=ev.target.closest('[data-orcmes]');if(om){S.orcMes=S.orcMes||{};S.orcMes[S.orcVer]=+om.dataset.orcmes;render(true);return}
  const cxm=ev.target.closest('[data-cxm]');if(cxm){S.cxMes=+cxm.dataset.cxm;render(true);return}
  const lr=ev.target.closest('[data-lanc]');if(lr){abrirLanc(lr.dataset.lanc);return}
  const cr=ev.target.closest('[data-conta]');if(cr&&!ev.target.closest('[data-acao]')){formConta(cr.dataset.conta);return}
  const b=ev.target.closest('[data-acao]');if(!b)return;const a=b.dataset.acao;
  try{
  if(a==='fechar')fecharDrawer();
  else if(a==='sel-todas'){S.sel=new Set(unidades().map(u=>u.key));render();renderPop()}
  else if(a==='pop-fechar')fecharPop();
  else if(a==='recarregar')render();
  else if(a==='recarregar-tudo')entrar(S.user);
  else if(a==='sair'){await sb.auth.signOut();location.hash='';aplicarMarca(null)}
  else if(a==='trocar-empresa'){await escolherEmpresa(true);render()}
  else if(a==='marca-emp')formMarca(b.dataset.emp);
  else if(a==='dados-emp')formDadosEmp(b.dataset.emp);
  else if(a==='alterar-senha')drawer(`<h3>Alterar senha</h3><form data-form="senha-nova" class="form-grid"><div class="field wide"><label for="nS1">Nova senha (mínimo 8 caracteres)</label><input id="nS1" name="senha" type="password" minlength="8" autocomplete="new-password" required></div><div class="field wide"><label for="nS2">Repita a senha</label><input id="nS2" name="senha2" type="password" minlength="8" autocomplete="new-password" required></div><div class="wide" style="display:flex;gap:8px"><button class="btn">Salvar</button><button type="button" class="btn ghost" data-acao="fechar">Cancelar</button></div></form>`);
  else if(a==='novo-lanc')formLanc();
  else if(a==='baixar')formBaixa(b.dataset.id);
  else if(ACOES_BOL[a])await ACOES_BOL[a](b);
  else if(a==='excluir-lanc'){const A=S._lancAberto?.l;const tr=A&&A.id===b.dataset.id&&ehTransf(conta(A.conta_id))&&A.vinculo_id;if(!confirm(tr?'Excluir esta transferência (saída e entrada)?':'Excluir este lançamento e suas parcelas?'))return;const alvo=tr?A.vinculo_id:b.dataset.id;await soltarExtrato(tr?[A.id,A.vinculo_id]:[b.dataset.id]);const {error}=await sb.from('lancamentos').delete().eq('id',alvo);if(error)throw error;invalidar();fecharDrawer();toast('Lançamento excluído.');render()}
  else if(a==='nova-conta')formConta();
  else if(formsCad[a])drawer(formsCad[a](b.dataset.emp));
  else if(a==='importar'){b.disabled=true;await executarImport()}
  else if(a==='desfazer-imp')await desfazerImport(b.dataset.id);
  else if(a==='convidar')formUsuario(null,b.dataset.emp);
  else if(a==='editar-usuario')formUsuario(b.dataset.uid);
  else if(ACOES_FAT[a])await ACOES_FAT[a](b);
  else if(ACOES_ORC[a])await ACOES_ORC[a](b);
  else if(ACOES_PF[a])await ACOES_PF[a](b);
  else if(ACOES_EXT[a])await ACOES_EXT[a](b);
  else if(ACOES_PES[a])await ACOES_PES[a](b);
  else if(a==='limpar-fx'){S.fx={cc:new Set(),pf:new Set(),ct:new Set()};fecharDrawer();atualizaFxBtn();render()}
  else if(a==='gerar-link'){b.disabled=true;const r=await chamarAdmin({acao:'link',email:b.dataset.email,redirectTo:BASE_URL});mostrarLink(b.dataset.email,r.link,false)}
  else if(a==='copiar-link'){const t=document.getElementById('linkAcesso');try{await navigator.clipboard.writeText(t.value);toast('Link copiado.')}catch(e){t.select();toast('Selecionei o link: copie com o menu do celular.')}}
  else if(a==='reenviar'){b.disabled=true;await chamarAdmin({acao:'reenviar',email:b.dataset.email,redirectTo:BASE_URL});toast('E-mail de acesso reenviado para '+b.dataset.email+'.');b.disabled=false}
  }catch(err){console.error(err);toast(traduz(err));b.disabled=false}
});
